[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["continuous_cartpole_env"]

[project]
name = "continuous_cartpole_env"
version = "0.0.1"
description = "Gymnasium CartPole with a continuous (Box) action space"
requires-python = ">=3.10"
dependencies = [
  "gymnasium",
  "pygame>=2.1.3",
]

[project.optional-dependencies]
dev = ["pre-commit"]
